server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/wasm application/octet-stream text/html;
    gzip_min_length 1024;

    # standard types plus wasm (in mime.types since nginx 1.21); the model file stays a binary
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }

    # ES modules must be served as JavaScript or the browser refuses the import
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location ~* ^/(vendor|models|fonts)/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ =404;
    }
}
